<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <h1>Painel Administrativo</h1>
      <p class="sub">Acesse para gerenciar suas rifas e causas</p>
      <div class="login-err hidden" id="loginErr"></div>
      <input type="email" id="loginEmail" placeholder="E-mail" autocomplete="username">
      <input type="password" id="loginPass" placeholder="Senha" autocomplete="current-password">
      <button onclick="doLogin()">Entrar</button>
      <p class="sub mt" style="margin-bottom:0;font-size:12px">Demo: admin@rifa.com / admin123</p>
    </div>
  </div>

  <div class="admin-shell" id="adminShell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><img src="/img/logo-default.png" alt=""><b>Rifa com Causa</b></div>
      <nav>
        <button data-view="dashboard" class="active">📊 Dashboard</button>
        <button data-view="rifas">🎟️ Rifas</button>
        <button data-view="relatorios">📄 Relatórios</button>
        <button data-view="usuarios" class="admin-only">👤 Usuários</button>
        <button data-view="config">⚙️ Configurações</button>
        <button data-view="logs">🕒 Logs</button>
      </nav>
      <div class="user">
        <div class="name" id="userName"></div>
        <div class="role" id="userRole"></div>
        <button class="logout" onclick="doLogout()">Sair</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="right">
          <button class="btn primary" onclick="openNewRifa()">+ Nova rifa</button>
          <a class="btn outline" href="/" target="_blank">Ver site</a>
        </div>
      </div>
      <div id="content"></div>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div class="toast" id="toast"></div>

  <script src="/js/common.js?v=2"></script>
  <script src="/js/admin.js?v=2"></script>
</body>
</html>
